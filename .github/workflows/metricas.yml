name: Métricas e votos
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [metricas.py]
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python metricas.py
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      - run: |
          git config user.name "penumbra-bot"
          git config user.email "penumbra-bot@users.noreply.github.com"
          git add metricas.json
          git diff --cached --quiet || (git commit -m "métricas $(date -u +%FT%H:%M)" && git pull --rebase -q && git push)
